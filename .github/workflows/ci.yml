name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: joinn
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: vocab
        run: cargo xtask vocab
      - name: modules
        run: cargo xtask modules
      - name: layers
        run: cargo xtask layers
      - name: corpus verify
        run: cargo xtask corpus verify
      - name: agree
        run: cargo xtask agree
      - name: assay agree
        run: cargo xtask assay agree
      - name: pick
        run: cargo xtask pick
      - name: regrow
        run: cargo xtask regrow
      - name: forces
        run: cargo xtask forces
      - name: power
        run: cargo xtask power
      - name: gate all
        run: cargo xtask gate all
