name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: joinn
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: vocab
        run: cargo xtask vocab
      - name: modules
        run: cargo xtask modules
      - name: corpus verify
        run: cargo xtask corpus verify
      - name: agree
        run: cargo xtask agree
      - name: power
        run: cargo xtask power
      - name: gate all
        run: cargo xtask gate all
        continue-on-error: true
