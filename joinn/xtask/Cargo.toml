[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
joinn-dna = { path = "../crates/joinn-dna" }
joinn-frame = { path = "../crates/joinn-frame" }
joinn-gate = { path = "../crates/joinn-gate" }
joinn-prim = { path = "../crates/joinn-prim", features = ["mutants"] }
joinn-live = { path = "../crates/joinn-live" }
joinn-host = { path = "../crates/joinn-host" }
joinn-link = { path = "../crates/joinn-link" }
joinn-assay = { path = "../crates/joinn-assay" }
joinn-test-host = { path = "../crates/joinn-test-host" }
joinn-cli = { path = "../crates/joinn-cli" }
joinn-visual = { path = "../crates/joinn-visual" }
joinn-gpu = { path = "../crates/joinn-gpu" }
# Features pinned so the workspace builds once: winit turns these on in the
# workspace build (on Linux); `cargo run -p xtask` resolves xtask's tree alone.
bitflags = { version = "2", features = ["std"] }
smallvec = { version = "1", features = ["const_generics", "const_new", "union"] }

[dev-dependencies]
joinn-shell-desktop = { path = "../crates/joinn-shell-desktop" }

[lints]
workspace = true

