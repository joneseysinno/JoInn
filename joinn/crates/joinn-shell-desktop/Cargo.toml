[package]
name = "joinn-shell-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "joinn-desktop"
path = "src/main.rs"

[dependencies]
joinn-frame = { path = "../joinn-frame" }
joinn-dna = { path = "../joinn-dna" }
joinn-gate = { path = "../joinn-gate" }
joinn-prim = { path = "../joinn-prim" }
joinn-live = { path = "../joinn-live" }
joinn-link = { path = "../joinn-link" }
joinn-host = { path = "../joinn-host" }
joinn-visual = { path = "../joinn-visual" }
joinn-gpu = { path = "../joinn-gpu" }
wgpu = "30"
winit = "0.30"
pollster = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
collapsible_if = "allow"
too_many_arguments = "allow"
