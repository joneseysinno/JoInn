[package]
name = "joinn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "joinn"
path = "src/main.rs"

[lib]
name = "joinn_cli"
path = "src/lib.rs"

[dependencies]
joinn-dna = { path = "../joinn-dna" }
joinn-frame = { path = "../joinn-frame" }
joinn-host = { path = "../joinn-host" }
joinn-live = { path = "../joinn-live" }
joinn-link = { path = "../joinn-link" }
# Features pinned so the workspace builds once: the gates' nested
# `cargo run -p joinn-cli` resolves this tree alone, and the workspace build has
# xtask's `mutants` and naga's `libm`. The CLI calls nothing either adds.
joinn-prim = { path = "../joinn-prim", features = ["mutants"] }
num-traits = { version = "0.2", features = ["libm"] }

[lints]
workspace = true
