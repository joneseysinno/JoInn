name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: vocab
        run: cargo xtask vocab
      - name: modules
        run: cargo xtask modules
      - name: agree
        run: cargo xtask agree
      - name: gate all
        run: cargo xtask gate all
      - name: power
        run: cargo xtask power
