[workspace]
resolver = "3"
members = [
    "crates/joinn-frame",
    "crates/joinn-dna",
    "crates/joinn-gate",
    "crates/joinn-prim",
    "crates/joinn-live",
    "crates/joinn-assay",
    "crates/joinn-link",
    "crates/joinn-host",
    "crates/joinn-test-host",
    "crates/joinn-cli",
    "crates/joinn-visual",
    "crates/joinn-gpu",
    "crates/joinn-shell-desktop",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
collapsible_if = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
overflow-checks = true
debug-assertions = true

[profile.dev.package."*"]
opt-level = 3

# xtask's tests compare gate check functions by address; optimized code merges
# identical function bodies (four gate 2.1/2.2 checks are one call each).
[profile.dev.package.xtask]
opt-level = 0
